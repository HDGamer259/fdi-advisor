name: keepalive
on:
  schedule:
    - cron: "17 */4 * * *"   # mỗi 4 giờ (Streamlit Cloud ngủ sau ~12h không có truy cập)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/keepalive.py
        env:
          APP_URLS: ${{ vars.APP_URLS }}
